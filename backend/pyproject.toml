[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-livestock-backend"
version = "0.1.0"
description = "FastAPI Backend for SIH 2026 Acoustic Livestock Health Early-Warning System"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
