[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-livestock-edge-simulator"
version = "0.1.0"
description = "Offline-First Edge Device Simulator for SIH 2026 Acoustic Livestock Health System"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
